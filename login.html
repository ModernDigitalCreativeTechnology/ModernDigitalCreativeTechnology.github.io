<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MDCT — Login</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif'],mono:['"JetBrains Mono"','monospace']}}}}</script>
    <style>
        @keyframes slideDownFade{0%{opacity:0;transform:translateY(-40px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes slideUpFade{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
        .animate-slide-down{animation:slideDownFade 5s cubic-bezier(0.16,1,0.3,1) forwards}
        .animate-slide-up{animation:slideUpFade 5s cubic-bezier(0.16,1,0.3,1) forwards}
        body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;padding:0;user-select:none}
        nav a{white-space:nowrap}
        .form-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 16px;color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box}
        .form-input:focus{border-color:rgba(255,255,255,0.35)}
        .form-input::placeholder{color:#475569}
    
        /* Content starts invisible; JS makes it visible after bg renders */
        #page-content {
            opacity: 0;
            pointer-events: none;
        }
        #page-content.reveal {
            pointer-events: auto;
        }
        /* Fade-in for the whole content block */
        #page-content.fade-in {
            animation: contentFadeIn 0.6s ease forwards;
        }
        @keyframes contentFadeIn {
            0%  { opacity:0; }
            100%{ opacity:1; }
        }
        /* Slide animations only fire after reveal */
        #page-content.reveal .animate-slide-down {
            animation: slideDownFade 1.4s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        #page-content.reveal .animate-slide-up {
            animation: slideUpFade 1.4s cubic-bezier(0.16,1,0.3,1) forwards;
        }
    </style>
</head>
<body class="min-h-full w-full relative bg-black text-slate-100 flex flex-col">

    <canvas id="particleCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <div id="page-content" class="relative z-10 flex flex-col min-h-screen px-6 sm:px-12 lg:px-16 py-8">

        <!-- Header -->
        <header class="animate-slide-down flex items-center justify-between w-full border-b border-white/[0.08] pb-6 mb-12">
            <a href="index.html" class="flex items-center gap-3 group flex-shrink-0">
                <img src="img/MDCT.png" class="w-10 h-10 object-contain transition-transform duration-300 group-hover:scale-105" alt="MDCT">
            </a>
            <nav class="flex items-center gap-6 sm:gap-8">
                <a href="index.html"    class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Home</a>
                <a href="products.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Product &amp; Services</a>
                <a href="disbot.html"   class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Dis Bot</a>
                <a href="contact.html"  class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Contact</a>
            </nav>
        </header>

        <!-- Login Form -->
        <main class="animate-slide-up flex-1 flex items-center justify-center">
            <div class="w-full max-w-md">
                <div class="mb-8 text-center">
                    <img src="img/MDCT.png" class="w-14 h-14 object-contain mx-auto mb-4" alt="MDCT">
                    <h1 class="text-3xl font-extrabold tracking-tight text-white">Admin Login</h1>
                    <p class="text-slate-500 text-sm mt-2 font-mono">Bot owner access only.</p>
                </div>

                <div class="p-8 bg-white/[0.03] border border-white/[0.08] rounded-xl">
                    <div id="loginMsg" class="hidden mb-5 p-3 rounded-md text-sm font-mono"></div>
                    <form id="loginForm" class="space-y-5">
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-2 uppercase tracking-widest">Email</label>
                            <input id="email" type="email" class="form-input" autocomplete="username" placeholder="admin@mdct.id" required>
                        </div>
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-2 uppercase tracking-widest">Password</label>
                            <input id="pass" type="password" class="form-input" autocomplete="current-password" placeholder="••••••••" required>
                        </div>
                        <button id="loginBtn" type="submit"
                            class="w-full py-3 bg-white text-black font-semibold text-sm rounded-md hover:bg-slate-200 transition-colors duration-200 mt-2">
                            Log in
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="text-[11px] font-mono text-slate-500 pt-4 border-t border-white/[0.05] mt-12">
            <p>&copy; MDCT. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script>
    const SUPABASE_URL = 'https://kgupwuinbzlehopvvntu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_It2zKEHriV_E_tDAUFoG4Q_gKU_tSRu';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMsg(text, type){
        const el = document.getElementById('loginMsg');
        el.className = 'mb-5 p-3 rounded-md text-sm font-mono ' + (type === 'err' ? 'bg-red-950/50 text-red-400 border border-red-900/50' : 'bg-emerald-950/50 text-emerald-400 border border-emerald-900/50');
        el.textContent = text;
    }

    // If already logged in, redirect to admin
    db.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = 'admin.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'Logging in…';
        const { error } = await db.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('pass').value
        });
        btn.disabled = false; btn.textContent = 'Log in';
        if (error) { showMsg('Wrong email or password.', 'err'); return; }
        document.getElementById('pass').value = '';
        window.location.href = 'admin.html';
    });


    /* Reveal page content after background has rendered for ~1.5s */
    (function(){
        const DELAY_MS = 200;
        const revealAt = performance.now() + DELAY_MS;
        let revealed = false;
        function checkReveal() {
            if (!revealed && performance.now() >= revealAt) {
                revealed = true;
                const el = document.getElementById('page-content');
                if (el) { el.classList.add('reveal', 'fade-in'); }
            }
            if (!revealed) requestAnimationFrame(checkReveal);
        }
        requestAnimationFrame(checkReveal);
    })();

    /* ── Background canvas ── */
    (function(){
        const canvas=document.getElementById('particleCanvas');if(!canvas)return;
        const ctx=canvas.getContext('2d');
        let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
        const hexR=38,hexW=Math.sqrt(3)*hexR,hexRS=hexR*1.5;
        let mouse={x:-1000,y:-1000};
        window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
        window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight});
        const pts=[];for(let i=0;i<40;i++)pts.push({x:Math.random()*W,y:Math.random()*H,size:Math.random()*5+3,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,angle:Math.random()*Math.PI*2,vRot:(Math.random()-.5)*.012,type:Math.floor(Math.random()*3)});
        function hex(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const a=(Math.PI/3)*i-(Math.PI/6);if(!i)ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));else ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();}
        function dp(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.9;
            if(p.type===0){ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.6,0);ctx.lineTo(0,p.size);ctx.lineTo(-p.size*.6,0);ctx.closePath();ctx.stroke();}
            else if(p.type===1){const s=p.size*.7;ctx.beginPath();ctx.rect(-s/2,-s/2,s,s);ctx.stroke();}
            else{ctx.beginPath();ctx.moveTo(0,-p.size*.8);ctx.lineTo(p.size*.7,p.size*.6);ctx.lineTo(-p.size*.7,p.size*.6);ctx.closePath();ctx.stroke();}
            ctx.restore();}
        function render(){
            ctx.clearRect(0,0,W,H);
            const cols=Math.ceil(W/hexW)+3,rows=Math.ceil(H/hexRS)+3;
            for(let r=-1;r<rows;r++){const y=r*hexRS,xo=(r%2!==0)?hexW/2:0;for(let c=-1;c<cols;c++){const x=c*hexW+xo,dx=x-mouse.x,dy=y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);let a=0.02;if(d<500)a=0.03+(1-d/500)*.035;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=0.6;hex(x,y,hexR);ctx.stroke();}}
            for(const p of pts){p.x+=p.vx;p.y+=p.vy;p.angle+=p.vRot;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;dp(p);}
            requestAnimationFrame(render);}
        render();
    })();
    </script>
</body>
</html>
