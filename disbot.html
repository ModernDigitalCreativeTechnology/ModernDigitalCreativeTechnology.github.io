<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDCT — Dis Bot</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif'],mono:['"JetBrains Mono"','monospace']}}}}</script>
    <style>
        @keyframes slideDownFade{0%{opacity:0;transform:translateY(-40px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes slideUpFade{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
        .animate-slide-down{animation:slideDownFade 5s cubic-bezier(0.16,1,0.3,1) forwards}
        .animate-slide-up{animation:slideUpFade 5s cubic-bezier(0.16,1,0.3,1) forwards}
        body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;padding:0;user-select:none}
        nav a{white-space:nowrap}
        ::-webkit-scrollbar{width:4px;background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
        .bot-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:24px;transition:border-color .3s}
        .bot-card:hover{border-color:rgba(255,255,255,0.15)}
        .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
        .status-online{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,0.6);animation:pulse-dot 2s infinite}
        .status-offline{background:#f87171}
        .stat-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#94a3b8}
        canvas.bot-chart{max-height:180px}
    
        /* Content starts invisible; JS makes it visible after bg renders */
        #page-content {
            opacity: 0;
            pointer-events: none;
        }
        #page-content.reveal {
            pointer-events: auto;
        }
        /* Fade-in for the whole content block */
        #page-content.fade-in {
            animation: contentFadeIn 0.6s ease forwards;
        }
        @keyframes contentFadeIn {
            0%  { opacity:0; }
            100%{ opacity:1; }
        }
        /* Slide animations only fire after reveal */
        #page-content.reveal .animate-slide-down {
            animation: slideDownFade 1.4s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        #page-content.reveal .animate-slide-up {
            animation: slideUpFade 1.4s cubic-bezier(0.16,1,0.3,1) forwards;
        }
    </style>
</head>
<body class="min-h-full w-full relative bg-black text-slate-100">

    <canvas id="particleCanvas" class="fixed inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <div id="page-content" class="relative z-10 flex flex-col min-h-screen px-6 sm:px-12 lg:px-16 py-8">

        <!-- Header -->
        <header class="animate-slide-down flex items-center justify-between w-full border-b border-white/[0.08] pb-6 mb-12">
            <a href="index.html" class="flex items-center gap-3 group flex-shrink-0">
                <img src="img/MDCT.png" class="w-10 h-10 object-contain transition-transform duration-300 group-hover:scale-105" alt="MDCT">
            </a>
            <nav class="flex items-center gap-6 sm:gap-8">
                <a href="index.html"    class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Home</a>
                <a href="products.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Product &amp; Services</a>
                <a href="disbot.html"   class="text-sm font-medium text-white transition-colors whitespace-nowrap">Dis Bot</a>
                <a href="contact.html"  class="text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">Contact</a>
                <a href="login.html"    class="px-5 py-2.5 bg-gradient-to-b from-slate-800/80 to-slate-900/80 backdrop-blur-md border border-white/20 rounded-md text-xs font-semibold text-white tracking-wider uppercase transition-all duration-300 hover:border-white/60 hover:shadow-[0_0_15px_rgba(255,255,255,0.15)] whitespace-nowrap">Login</a>
            </nav>
        </header>

        <!-- Page Content -->
        <main class="animate-slide-up flex-1">
            <div class="mb-10">
                <span class="inline-flex items-center gap-2 px-3 py-1 bg-white/[0.04] border border-white/10 rounded-sm text-xs font-mono text-slate-300 uppercase tracking-widest mb-4">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Live Status
                </span>
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white leading-tight mt-3">Dis Bot</h1>
                <p class="mt-4 text-slate-400 text-lg font-light">Real-time status and metrics for all MDCT Discord bots.</p>
            </div>

            <!-- Bot cards rendered here -->
            <div id="bot-container">
                <div class="text-slate-500 font-mono text-sm py-10 text-center">Fetching bot data…</div>
            </div>
        </main>

        <footer class="text-[11px] font-mono text-slate-500 pt-4 border-t border-white/[0.05] mt-12">
            <p>&copy; MDCT. All rights reserved.</p>
        </footer>
    </div>

    <script>
    /* ── Chart.js global style ── */
    Chart.defaults.color = '#64748b';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

    const API = 'https://kgupwuinbzlehopvvntu.supabase.co/rest/v1/bot_status?select=*&apikey=sb_publishable_It2zKEHriV_E_tDAUFoG4Q_gKU_tSRu';
    const FALLBACK = [];
    const REFRESH_MS = 10000;
    const HIST_API = 'https://kgupwuinbzlehopvvntu.supabase.co/rest/v1/ping_history';
    const HIST_KEY = 'sb_publishable_It2zKEHriV_E_tDAUFoG4Q_gKU_tSRu';
    let historyLoaded = false;

    // Ambil 60 ping terakhir dari tabel ping_history (kalau tabelnya belum ada, di-skip)
    async function loadHistory(){
        try {
            const res = await fetch(HIST_API + '?select=bot_id,ping,created_at&order=created_at.desc&limit=600', {
                headers: { apikey: HIST_KEY, Authorization: 'Bearer ' + HIST_KEY }
            });
            if (!res.ok) throw new Error('no history');
            const rows = (await res.json()).reverse();
            rows.forEach(r => {
                const h = ensureHistory(r.bot_id);
                if (r.ping != null) h.push({ t: r.created_at, v: r.ping });
            });
            Object.keys(pingHistories).forEach(id => {
                pingHistories[id] = pingHistories[id].slice(-60);
            });
        } catch (e) { /* history kosong, lanjut tanpa */ }
    }
    // Store ping history per bot id
    const pingHistories = {};

    function ago(ms){
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 5) return 'just now'; if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s/60) + 'm ago';
        return Math.floor(s/3600) + 'h ago';
    }

    function ensureHistory(id){
        if (!pingHistories[id]) pingHistories[id] = [];
        return pingHistories[id];
    }

    const chartInstances = {};

    function renderBots(bots){
        const container = document.getElementById('bot-container');
        bots.forEach(bot => {
            const offline = bot.status === 'offline';
            const updated = bot.updated_at ? Date.parse(bot.updated_at) : null;
            const age = updated ? Date.now() - updated : Infinity;
            const isOnline = !offline && age < 90000;

            // Update ping history
            const hist = ensureHistory(bot.id);
            if (isOnline && bot.ping != null && !hist.some(x => x.t === bot.updated_at)){
                hist.push({ t: bot.updated_at, v: bot.ping });
                if (hist.length > 60) hist.shift();
            }

            const existing = document.getElementById('bot-card-' + bot.id);
            if (existing) {
                // Update text nodes
                existing.querySelector('.bot-status-text').textContent = isOnline ? 'Online' : 'Offline';
                existing.querySelector('.bot-ping').textContent = bot.ping != null ? bot.ping + ' ms' : '—';
                existing.querySelector('.bot-guilds').textContent = bot.guilds ?? '—';
                existing.querySelector('.bot-updated').textContent = updated ? ago(age) : '—';
                const dot = existing.querySelector('.status-dot');
                dot.className = 'status-dot ' + (isOnline ? 'status-online' : 'status-offline');
                // Update chart
                updateChart(bot.id);
                return;
            }

            // Build card
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.id = 'bot-card-' + bot.id;
            card.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-5">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
                            <span class="bot-status-text text-xs font-mono text-slate-400">${isOnline ? 'Online' : 'Offline'}</span>
                        </div>
                        <h2 class="text-xl font-bold text-white">${bot.name}</h2>
                        <p class="text-slate-500 text-sm font-mono">${bot.username}</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <span class="stat-pill">Ping: <strong class="bot-ping text-slate-200">${bot.ping != null ? bot.ping + ' ms' : '—'}</strong></span>
                        <span class="stat-pill">Servers: <strong class="bot-guilds text-slate-200">${bot.guilds ?? '—'}</strong></span>
                        <span class="stat-pill">Updated: <strong class="bot-updated text-slate-200">${updated ? ago(age) : '—'}</strong></span>
                    </div>
                </div>
                <div style="position:relative;height:160px">
                    <canvas id="chart-${bot.id}" class="bot-chart"></canvas>
                </div>
                <p class="text-[11px] font-mono text-slate-600 mt-2">Ping history (last 60 reads)</p>
            `;
            container.appendChild(card);

            // Init chart
            const ctx = document.getElementById('chart-' + bot.id).getContext('2d');
            chartInstances[bot.id] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Ping (ms)',
                        data: [],
                        backgroundColor: 'rgba(52,211,153,0.7)',
                        hoverBackgroundColor: '#34d399',
                        borderRadius: 2,
                        borderSkipped: false,
                        barPercentage: 0.85,
                        categoryPercentage: 1.0
                    }]
                },
                options: {
                    animation: { duration: 400 },
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.parsed.y + ' ms' } } },
                    scales: {
                        x: { display: false },
                        y: { min: 0, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } }
                    }
                }
            });
            updateChart(bot.id);
        });
    }

    function updateChart(id){
        const chart = chartInstances[id];
        const hist = pingHistories[id] || [];
        if (!chart) return;
        chart.data.labels = hist.map((_, i) => i);
        chart.data.datasets[0].data = hist.map(h => h.v);
        chart.update('none');
    }

    async function fetchBots(){
        try {
            if (!historyLoaded) { historyLoaded = true; await loadHistory(); }
            const res = await fetch(API);
            if (!res.ok) throw new Error('API error');
            const data = await res.json();
            if (!Array.isArray(data) || data.length === 0) throw new Error('empty');
            renderBots(data);
        } catch {
            renderBots(FALLBACK);
        }
    }

    fetchBots();
    setInterval(fetchBots, REFRESH_MS);


    /* Reveal page content after background has rendered for ~1.5s */
    (function(){
        const DELAY_MS = 200;
        const revealAt = performance.now() + DELAY_MS;
        let revealed = false;
        function checkReveal() {
            if (!revealed && performance.now() >= revealAt) {
                revealed = true;
                const el = document.getElementById('page-content');
                if (el) { el.classList.add('reveal', 'fade-in'); }
            }
            if (!revealed) requestAnimationFrame(checkReveal);
        }
        requestAnimationFrame(checkReveal);
    })();

    /* ── Background canvas ── */
    (function(){
        const canvas=document.getElementById('particleCanvas');if(!canvas)return;
        const ctx2=canvas.getContext('2d');
        let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
        const hexR=38,hexW=Math.sqrt(3)*hexR,hexRS=hexR*1.5;
        let mouse={x:-1000,y:-1000};
        window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
        window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight});
        const pts=[];for(let i=0;i<40;i++)pts.push({x:Math.random()*W,y:Math.random()*H,size:Math.random()*5+3,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,angle:Math.random()*Math.PI*2,vRot:(Math.random()-.5)*.012,type:Math.floor(Math.random()*3)});
        function hex(x,y,r){ctx2.beginPath();for(let i=0;i<6;i++){const a=(Math.PI/3)*i-(Math.PI/6);if(!i)ctx2.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));else ctx2.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}ctx2.closePath();}
        function dp(p){ctx2.save();ctx2.translate(p.x,p.y);ctx2.rotate(p.angle);ctx2.strokeStyle='rgba(255,255,255,0.3)';ctx2.lineWidth=0.9;
            if(p.type===0){ctx2.beginPath();ctx2.moveTo(0,-p.size);ctx2.lineTo(p.size*.6,0);ctx2.lineTo(0,p.size);ctx2.lineTo(-p.size*.6,0);ctx2.closePath();ctx2.stroke();}
            else if(p.type===1){const s=p.size*.7;ctx2.beginPath();ctx2.rect(-s/2,-s/2,s,s);ctx2.stroke();}
            else{ctx2.beginPath();ctx2.moveTo(0,-p.size*.8);ctx2.lineTo(p.size*.7,p.size*.6);ctx2.lineTo(-p.size*.7,p.size*.6);ctx2.closePath();ctx2.stroke();}
            ctx2.restore();}
        function render(){
            ctx2.clearRect(0,0,W,H);
            const cols=Math.ceil(W/hexW)+3,rows=Math.ceil(H/hexRS)+3;
            for(let r=-1;r<rows;r++){const y=r*hexRS,xo=(r%2!==0)?hexW/2:0;for(let c=-1;c<cols;c++){const x=c*hexW+xo,dx=x-mouse.x,dy=y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);let a=0.02;if(d<500)a=0.03+(1-d/500)*.035;ctx2.strokeStyle=`rgba(255,255,255,${a})`;ctx2.lineWidth=0.6;hex(x,y,hexR);ctx2.stroke();}}
            for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){ctx2.strokeStyle=`rgba(255,255,255,${(1-d/150)*.18})`;ctx2.lineWidth=0.8;ctx2.beginPath();ctx2.moveTo(pts[i].x,pts[i].y);ctx2.lineTo(pts[j].x,pts[j].y);ctx2.stroke();}}
            for(const p of pts){p.x+=p.vx;p.y+=p.vy;p.angle+=p.vRot;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;dp(p);}
            requestAnimationFrame(render);}
        render();
    })();
    </script>
</body>
</html>
